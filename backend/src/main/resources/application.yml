server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: curriculum-intelligence-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/curriculum_intelligence}}
    username: ${DB_USERNAME:${POSTGRES_USER:curriculum_app}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  security:
    allow-header-identity: ${APP_SECURITY_ALLOW_HEADER_IDENTITY:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  llm:
    provider: ${LLM_PROVIDER:disabled}
    model: ${LLM_MODEL:}
    apiKey: ${LLM_API_KEY:}
  institution:
    default-name: ${DEFAULT_INSTITUTION:KLE Technological University, Belagavi}
    default-department: ${DEFAULT_DEPARTMENT:School of Computer Science & Engineering (AI)}
  embedding:
    enabled: ${EMBEDDING_ENABLED:true}
    model: ${EMBEDDING_MODEL:BAAI/bge-small-en-v1.5}
    dimension: ${EMBEDDING_DIMENSION:384}
    api-url: ${EMBEDDING_API_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:15}
    batch-size: ${EMBEDDING_BATCH_SIZE:32}
    max-retries: ${EMBEDDING_MAX_RETRIES:3}
    retry-delay-ms: ${EMBEDDING_RETRY_DELAY_MS:1000}
    rrf-constant: ${EMBEDDING_RRF_CONSTANT:60}
