server:
  port: 0

spring:
  datasource:
    url: ${DB_TEST_URL:jdbc:postgresql://localhost:5432/curriculum_intelligence}
    username: ${DB_TEST_USERNAME:curriculum_app}
    password: ${DB_TEST_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    allow-header-identity: true
  cors:
    allowed-origins: http://localhost:5173

