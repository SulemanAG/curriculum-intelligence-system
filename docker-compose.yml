version: '3.8'

# Curriculum AI - Root Docker Compose for Development
# Runs PostgreSQL 16 with persistent volume and health check

services:
  postgres:
    image: postgres:16-alpine
    container_name: curriculumai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-curriculum_ai}
      POSTGRES_USER: ${POSTGRES_USER:-curriculum_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curriculum_secret_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curriculum_admin} -d ${POSTGRES_DB:-curriculum_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: curriculumai_postgres_data

